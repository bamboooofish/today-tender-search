<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="查詢、篩選今日與近 14 天政府招標公告，並按需查看標案詳細資訊。"
    />
    <title>今日政府標案查詢</title>
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
      defer
    ></script>
    <script src="./app.js" defer></script>
    <!-- LOCAL-ONLY:START -->
    <script src="./local-test.js" defer></script>
    <!-- LOCAL-ONLY:END -->
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1>今日政府標案查詢</h1>
        <p>可查詢今日或近 14 天公告，並透過多組條件整理標案資訊</p>
      </div>
    </header>

    <main class="page-wrap">
      <section class="panel" aria-labelledby="filter-title" data-collapsible>
        <div class="section-heading section-heading-row">
          <div class="step-title-group">
            <h2 id="filter-title">
              <span class="step-number" aria-hidden="true">1</span
              ><span class="step-title">篩選條件</span>
            </h2>
            <p class="muted step-description">
              <span class="filter-help-desktop">每個欄位可輸入多個關鍵字，以逗號、頓號或換行分隔</span
              ><span class="filter-help-mobile">以 , 分隔關鍵字</span>
            </p>
          </div>
          <button
            class="collapse-toggle"
            type="button"
            data-label="篩選條件"
            aria-label="收合篩選條件"
            aria-expanded="true"
            aria-controls="filterContent"
          >
            <span class="collapse-icon" aria-hidden="true">▼</span>
          </button>
        </div>
        <div class="panel-content" id="filterContent">
          <!-- LOCAL-ONLY:START -->
          <div id="localTestTools" class="local-test" hidden>
            <button
              class="button button-secondary"
              id="collectToday"
              type="button"
            >
              蒐集今日標案（本機測試）
            </button>
            <span
              id="collectStatus"
              class="muted"
              role="status"
              aria-live="polite"
            ></span>
            <button
              class="button button-secondary local-test-dismiss"
              id="hideLocalTestTools"
              type="button"
            >
              隱藏
            </button>
          </div>
          <!-- LOCAL-ONLY:END -->

          <div class="date-filter" aria-labelledby="dateFilterTitle">
            <h3 id="dateFilterTitle">公告時間</h3>
            <div class="date-mode-row">
              <div class="segmented-control" role="group" aria-label="公告時間範圍">
                <button class="segment-button is-active" type="button" data-date-mode="today" aria-pressed="true">今日</button>
                <button class="segment-button" type="button" data-date-mode="last14" aria-pressed="false">近14天</button>
                <button class="segment-button" type="button" data-date-mode="custom" aria-pressed="false">指定日期</button>
              </div>
            </div>
            <div id="customDateRange" class="date-range-inputs" hidden>
              <label><span class="visually-hidden">開始日期</span><input id="dateFrom" type="date" /></label>
              <span aria-hidden="true">至</span>
              <label><span class="visually-hidden">結束日期</span><input id="dateTo" type="date" /></label>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-group-heading">
              <h3>查詢組合</h3>
              <div id="filterGroupTabs" class="filter-group-tabs" role="tablist" aria-label="查詢組合"></div>
              <button class="button button-outline" id="addFilterGroup" type="button">＋新增</button>
            </div>
            <div id="filterGroupEditor"></div>
          </div>

          <div class="button-row button-row-center">
            <button
              class="button button-secondary"
              id="resetFilters"
              type="button"
            >
              清除內容
            </button>
            <button
              class="button button-primary"
              id="applyFilters"
              type="button"
            >
              套用篩選
            </button>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="list-title" data-collapsible>
        <div
          class="section-heading section-heading-row section-heading-row-controls"
        >
          <div class="step-title-group">
            <h2 id="list-title">
              <span class="step-number" aria-hidden="true">2</span
              ><span class="step-title">選擇標案</span>
            </h2>
            <p id="visibleCount" class="muted step-description step-meta"></p>
          </div>
          <div class="section-header-controls">
            <div class="section-header-actions">
              <button
                class="button button-secondary"
                id="clearSelection"
                type="button"
              >
                清除選取
              </button>
              <button
                class="button button-primary"
                id="downloadExcel"
                type="button"
                disabled
              >
                下載表格
              </button>
            </div>
            <button
              class="collapse-toggle"
              type="button"
              data-label="選擇標案"
              aria-label="收合選擇標案"
              aria-expanded="true"
              aria-controls="listContent"
            >
              <span class="collapse-icon" aria-hidden="true">▼</span>
            </button>
          </div>
        </div>
        <div class="panel-content" id="listContent">
          <div id="resultTabs" class="result-tabs" role="tablist" aria-label="篩選結果"></div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col" class="select-column">選取</th>
                  <th scope="col">公告日期</th>
                  <th scope="col">公告類型</th>
                  <th scope="col">機關名稱</th>
                  <th scope="col">標案名稱</th>
                </tr>
              </thead>
              <tbody id="tenderRows"></tbody>
            </table>
            <p id="emptyList" class="empty-state" hidden></p>
          </div>
        </div>
      </section>

      <section
        class="panel"
        id="detailsPanel"
        aria-labelledby="details-title"
        data-collapsible
      >
        <div
          class="section-heading section-heading-row section-heading-row-controls"
        >
          <div class="step-title-group">
            <h2 id="details-title">
              <span class="step-number" aria-hidden="true">3</span
              ><span class="step-title">查詢選擇標案</span>
            </h2>
            <p
              id="detailsStatus"
              class="muted step-description"
              role="status"
              aria-live="polite"
            >
              請先選擇標案
            </p>
          </div>
          <div class="section-header-controls">
            <div class="section-header-actions">
              <button
                class="button button-secondary"
                id="copyDetails"
                type="button"
                disabled
              >
                複製結果
              </button>
              <button
                class="button button-primary"
                id="fetchDetails"
                type="button"
                disabled
              >
                查詢標案
              </button>
            </div>
            <button
              class="collapse-toggle"
              type="button"
              data-label="查詢選擇標案"
              aria-label="收合查詢選擇標案"
              aria-expanded="true"
              aria-controls="detailsContent"
            >
              <span class="collapse-icon" aria-hidden="true">▼</span>
            </button>
          </div>
        </div>
        <div class="panel-content" id="detailsContent">
          <div id="detailResults"></div>
        </div>
      </section>
    </main>

    <button
      id="backToTop"
      class="back-to-top"
      type="button"
      aria-label="回到最上方"
      hidden
    >
      <span aria-hidden="true">↑</span>回到最上方
    </button>

    <footer class="site-footer">
      資料來源：<a
        href="https://web.pcc.gov.tw/prkms/today/common/todayTender"
        target="_blank"
        rel="noopener noreferrer"
        >今日招標 - 政府電子採購網- 公共工程委員會</a
      >
      、<a
        href="https://data.openfun.tw/datasets/tw.openfun~api~procurement"
        target="_blank"
        rel="noopener noreferrer"
        >CC-BY 歐噴政府採購標案 API</a
      >
    </footer>
  </body>
</html>
