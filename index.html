<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查詢、篩選今日政府招標公告，並按需查看標案詳細資訊。">
  <title>今日政府標案查詢</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
  <script src="./app.js" defer></script>
  <!-- LOCAL-ONLY:START -->
  <script src="./local-test.js" defer></script>
  <!-- LOCAL-ONLY:END -->
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>今日政府標案查詢</h1>
      <p>僅顯示今日公告的招標資訊，標案詳細資訊可在選取標案後查詢</p>
    </div>
  </header>

  <main class="page-wrap">
    <section class="panel" aria-labelledby="filter-title" data-collapsible>
      <div class="section-heading section-heading-row">
        <div class="step-title-group">
          <h2 id="filter-title"><span class="step-number" aria-hidden="true">1</span><span class="step-title">篩選條件</span></h2>
          <p class="muted step-description"><span class="filter-help-desktop">每個欄位可輸入多個關鍵字，以逗號、頓號或換行分隔</span><span class="filter-help-mobile">以 , 分隔關鍵字</span></p>
        </div>
        <button class="collapse-toggle" type="button" data-label="篩選條件" aria-label="收合篩選條件" aria-expanded="true" aria-controls="filterContent"><span class="collapse-icon" aria-hidden="true">▼</span></button>
      </div>
      <div class="panel-content" id="filterContent">
      <!-- LOCAL-ONLY:START -->
      <div id="localTestTools" class="local-test" hidden>
        <button class="button button-secondary" id="collectToday" type="button">蒐集今日標案（本機測試）</button>
        <span id="collectStatus" class="muted" role="status" aria-live="polite"></span>
      </div>
      <!-- LOCAL-ONLY:END -->

      <div class="filter-group">
        <h3>包含條件</h3>
        <div class="field-grid">
          <div class="field">
            <textarea id="titleInclude" rows="3" placeholder="標案名稱" aria-label="包含條件：標案名稱"></textarea>
          </div>
          <div class="field">
            <textarea id="agencyInclude" rows="3" placeholder="機關名稱" aria-label="包含條件：機關名稱"></textarea>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <h3>排除條件</h3>
        <div class="field-grid">
          <div class="field">
            <textarea id="titleExclude" rows="3" placeholder="標案名稱" aria-label="排除條件：標案名稱"></textarea>
          </div>
          <div class="field">
            <textarea id="agencyExclude" rows="3" placeholder="機關名稱" aria-label="排除條件：機關名稱"></textarea>
          </div>
        </div>
      </div>

      <div class="button-row button-row-center">
        <button class="button button-primary" id="applyFilters" type="button">套用篩選</button>
        <button class="button button-secondary" id="resetFilters" type="button">清除篩選</button>
      </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="list-title" data-collapsible>
      <div class="section-heading section-heading-row section-heading-row-controls">
        <div class="step-title-group">
          <h2 id="list-title"><span class="step-number" aria-hidden="true">2</span><span class="step-title">選擇標案</span></h2>
          <p id="visibleCount" class="muted step-description step-meta"></p>
        </div>
        <div class="section-header-controls">
          <div class="section-header-actions">
            <button class="button button-primary" id="downloadExcel" type="button" disabled>下載表格</button>
            <button class="button button-secondary" id="clearSelection" type="button">清除選取</button>
          </div>
          <button class="collapse-toggle" type="button" data-label="選擇標案" aria-label="收合選擇標案" aria-expanded="true" aria-controls="listContent"><span class="collapse-icon" aria-hidden="true">▼</span></button>
        </div>
      </div>
      <div class="panel-content" id="listContent">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col" class="select-column">選取</th>
              <th scope="col">公告類型</th>
              <th scope="col">機關名稱</th>
              <th scope="col">標案名稱</th>
            </tr>
          </thead>
          <tbody id="tenderRows"></tbody>
        </table>
        <p id="emptyList" class="empty-state" hidden></p>
      </div>
      </div>
    </section>

    <section class="panel" id="detailsPanel" aria-labelledby="details-title" data-collapsible>
      <div class="section-heading section-heading-row section-heading-row-controls">
        <div class="step-title-group">
          <h2 id="details-title"><span class="step-number" aria-hidden="true">3</span><span class="step-title">查詢選擇標案</span></h2>
          <p id="detailsStatus" class="muted step-description" role="status" aria-live="polite">請選擇欲查詢的標案後，按「查詢詳細資訊」</p>
        </div>
        <div class="section-header-controls">
          <div class="section-header-actions">
            <button class="button button-primary" id="fetchDetails" type="button" disabled>查詢詳細資訊</button>
            <button class="button button-secondary" id="copyDetails" type="button" disabled>複製結果</button>
          </div>
          <button class="collapse-toggle" type="button" data-label="查詢選擇標案" aria-label="收合查詢選擇標案" aria-expanded="true" aria-controls="detailsContent"><span class="collapse-icon" aria-hidden="true">▼</span></button>
        </div>
      </div>
      <div class="panel-content" id="detailsContent">
        <div id="detailResults"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    資料來源：<a href="https://web.pcc.gov.tw/prkms/today/common/todayTender" target="_blank" rel="noopener noreferrer">今日招標 - 政府電子採購網- 公共工程委員會</a> 、<a href="https://data.openfun.tw/datasets/tw.openfun~api~procurement" target="_blank" rel="noopener noreferrer">CC-BY 歐噴政府採購標案 API</a>
  </footer>
</body>
</html>
