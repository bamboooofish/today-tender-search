name: Collect and publish tender viewer

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whether the daily archive is initialized
        id: archive_state
        env:
          ARCHIVE_EMPTY: ${{ hashFiles('data/archive/*.json') == '' }}
        run: echo "archive_empty=$ARCHIVE_EMPTY" >> "$GITHUB_OUTPUT"

      - name: Install collector dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.archive_state.outputs.archive_empty == 'true'
        run: python -m pip install -r requirements.txt

      - name: Collect and archive today's tenders
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.archive_state.outputs.archive_empty == 'true'
        run: python collect_action.py

      - name: Build static site
        run: python build_site.py

      - name: Commit daily archive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.archive_state.outputs.archive_empty == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive data/recent.json
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "chore: archive daily tender snapshot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
